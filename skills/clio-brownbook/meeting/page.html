body{background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--f-body)}

main .wrap{padding-block:20px 48px;display:grid;gap:28px}

h2{font:700 22px/1.3 var(--f-display);margin:0;display:flex;align-items:baseline;gap:10px}
h2 small{font:500 13px var(--f-num);color:var(--muted)}
.story{background:var(--paper);border:1px solid var(--line);border-radius:10px}
.story summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.story summary::-webkit-details-marker{display:none}

.story h3{font:600 17px/1.5 var(--f-display);margin:0;min-width:0}

.s-study{background:var(--study-bg);color:var(--study)} .s-urgent{background:var(--urgent-bg);color:var(--urgent)}
.story .body{padding:0 16px 14px 44px;display:grid;gap:8px}
.story ul{margin:0;padding-left:18px;display:grid;gap:4px}
.refs{font:500 12.5px/1.6 var(--f-num);color:var(--muted);overflow-wrap:anywhere}
.chev{transition:transform .15s}

.plain{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.plain ol,.plain ul{margin:0;padding-left:22px;display:grid;gap:8px}

.empty{color:var(--muted);font-size:15px}

@media (prefers-reduced-motion:reduce){.chev{transition:none}}

<script>
(function(){
  const R = JSON.parse(document.getElementById('report').textContent);
  const LABEL = {prod:'ขึ้นจริงแล้ว', dev:'อยู่ dev', study:'ศึกษา/คุย', urgent:'เร่ง'};
  const NAME = Object.fromEntries(R.projects.map(p => [p.key, p.name]));
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  let tab = 'all', filter = 'all';
  try { tab = localStorage.getItem('bb-tab') || 'all'; } catch (e) {}
  if (location.hash.slice(1) && (location.hash.slice(1) === 'all' || NAME[location.hash.slice(1)])) tab = location.hash.slice(1);
  if (tab !== 'all' && !NAME[tab]) tab = 'all';

  document.getElementById('eyebrow').textContent = R.week + ' · ' + R.range;
  document.getElementById('headline').textContent = 'สัปดาห์ที่แล้ว ทำอะไรไปบ้าง';
  const T = R.totals, tot = document.getElementById('totals');
  [['PR', T.prs], ['ขึ้นจริง', T.prod], ['ค้าง dev', T.dev], ['ใบงาน', T.issues]].forEach(([k, v]) => {
    const s = el('span'); s.append(el('b', null, v), k); tot.append(s);
  });
  document.getElementById('foot').textContent = 'อัปเดต ' + R.updated + ' จากบันทึก ' + R.week + ' ใน repo clio';

  const tabs = document.getElementById('tabs');
  const all = [{key:'all', name:'ทั้งหมด', items:R.projects.flatMap(p => p.items)}].concat(R.projects);
  all.forEach(p => {
    const b = el('button', 'tab'); b.setAttribute('role', 'tab'); b.dataset.k = p.key; b.id = 'tab-' + p.key;
    b.append(p.name, el('span', 'n', p.items.length));
    b.onclick = () => { tab = p.key; try { localStorage.setItem('bb-tab', tab); } catch (e) {} history.replaceState(null, '', '#' + tab); render(); };
    tabs.append(b);
  });
  const fl = document.getElementById('filters');
  [['all','ทุกสถานะ'],['prod','ขึ้นจริงแล้ว'],['dev','อยู่ dev'],['study','ศึกษา/คุย']].forEach(([k, n]) => {
    const b = el('button', 'chip', n); b.id = 'f-' + k; b.dataset.k = k;
    b.onclick = () => { filter = k; render(); }; fl.append(b);
  });

  function render(){
    tabs.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.k === tab));
    fl.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === filter));
    const box = document.getElementById('stories'); box.replaceChildren();
    R.projects.filter(p => tab === 'all' || p.key === tab).forEach(p => {
      const items = p.items.filter(i => filter === 'all' || i.status === filter);
      const sec = el('section', 'proj'); const h = el('h2', null, p.name);
      const nProd = p.items.filter(i => i.status === 'prod').length;
      h.append(el('small', null, nProd + '/' + p.items.length + ' ขึ้นจริง')); sec.append(h);
      if (!items.length) sec.append(el('p', 'empty', 'ไม่มีงานในสถานะนี้'));
      items.forEach((it, i) => {
        const d = el('details', 'story'); const s = el('summary');
        const num = el('span', 'num'); num.append(el('span', 'chev', '›'), ' ' + (i + 1));
        const h3 = el('h3', null, it.title); h3.append(el('span', 'gist', it.gist));
        s.append(num, h3, el('span', 'pill s-' + it.status, LABEL[it.status])); d.append(s);
        const body = el('div', 'body');
        if (it.points.length) { const ul = el('ul'); it.points.forEach(t => ul.append(el('li', null, t))); body.append(ul); }
        if (it.refs) body.append(el('div', 'refs', it.refs));
        if (body.childNodes.length) d.append(body); else s.style.cursor = 'default';
        sec.append(d);
      });
      box.append(sec);
    });
    const list = (id, rows, f) => { const u = document.getElementById(id); u.replaceChildren(); rows.forEach(r => u.append(f(r))); };
    const mine = r => tab === 'all' || r.p === tab;
    const withTag = r => { const li = el('li', null, r.t); if (tab === 'all') li.append(el('span', 'tagp', NAME[r.p] || r.p)); return li; };
    const off = R.offgit.filter(mine);
    list('offgit', off.length ? off : [{t:'ไม่มี'}], withTag);
    const nx = R.next.filter(mine);
    list('next', nx.length ? nx : [{t:'ไม่มี'}], r => { const li = withTag(r); if (r.urgent) li.prepend(el('span', 'pill s-urgent', 'เร่ง'), ' '); return li; });
    document.getElementById('unsureSec').hidden = !(R.unsure || []).length;
    list('unsure', R.unsure || [], t => el('li', null, t));
  }
  render();
  addEventListener('hashchange', () => { const k = location.hash.slice(1); if (k === 'all' || NAME[k]) { tab = k; render(); } });
})();
</script>
